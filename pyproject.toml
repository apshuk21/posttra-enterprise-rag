[project]
name = "posttra-enterprise-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "jinja2==3.1.6",
    "pydantic-settings==2.8.1",
    "boto3==1.37.38",
    "psycopg[binary,pool]==3.2.6",
    "pypdf==5.4.0",
    "python-docx==1.1.2",
    "httpx==0.28.1",
    "langgraph>=0.2,<2",
    "pinecone>=5,<9",
    "python-dotenv==1.0.1",

    # Observability
    "glassflow-rius>=1.0,<2.0",
]

[project.scripts]
posttra-enterprise-rag = "posttra_enterprise_rag:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"